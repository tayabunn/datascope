name: DataScope Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # JOB 1: CODE QUALITY & TYPESCRIPT VALIDATION
  # ==========================================================================
  typecheck:
    name: TypeScript & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: cd backend && npm install

      - name: Install Frontend Dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Typecheck Backend
        run: npx tsc --project backend/tsconfig.json --noEmit

      - name: Typecheck Frontend
        run: npx tsc --project frontend/tsconfig.json --noEmit

  # ==========================================================================
  # JOB 2: AUTOMATED TESTING & 100K RECORD BENCHMARK
  # ==========================================================================
  test-backend:
    name: Backend Test Suite & 100k Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: cd backend && npm install

      - name: Run 12 Automated Test Suites & Performance Benchmark
        run: cd backend && npm test

  # ==========================================================================
  # JOB 3: FRONTEND PRODUCTION BUILD VERIFICATION
  # ==========================================================================
  build-frontend:
    name: Next.js 15 App Router Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Build Next.js Production Bundle
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: cd frontend && npm run build

  # ==========================================================================
  # JOB 4: DOCKER COMPOSE CONFIGURATION VALIDATION
  # ==========================================================================
  docker-validation:
    name: Docker Compose Syntax & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
