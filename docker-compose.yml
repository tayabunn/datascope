version: "3.8"

services:
  # 1. PostgreSQL Relational Database (100k+ Records Store)
  postgres:
    image: postgres:16-alpine
    container_name: datascope-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datascope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datascope"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. DataScope Backend REST API (Node.js + Express + Drizzle ORM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datascope-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/datascope
    depends_on:
      postgres:
        condition: service_healthy

  # 3. DataScope Frontend Client (Next.js 15 + Redux Toolkit + Tailwind)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datascope-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_BACKEND_URL: http://backend:5000
    depends_on:
      - backend

volumes:
  postgres_data:
